[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project]
name = "mcp-sbt-shell"
version = "0.1.0"
description = "An MCP server for executing commands in a persistent sbt shell session"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.13.1",
]

[dependency-groups]
dev = [
    "ruff>=0.1.0",
    "pytest>=8.0.0",
    "anthropic>=0.40.0",
]

[project.scripts]
mcp-sbt-shell = "mcp_sbt_shell.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "RUF"]
